<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fae4c6" />
    <meta name="color-scheme" content="only light" />
    <title>Lucky Cat</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- The picture of the loading screen is asked for before any script runs. -->
    <link rel="preload" as="image" type="image/webp" href="./assets/loading-Bn2v9oht.webp" />
    <!-- Official Telegram Mini Apps script. Outside Telegram it is harmless. -->
    <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
    <style>html,body{background:#fae4c6;margin:0}#boot{z-index:100;justify-content:center;display:flex;position:fixed;inset:0}#boot>.boot-picture{object-fit:cover;object-position:center bottom;background:#8f150c;width:100%;max-width:480px;height:100%}#boot>.boot-old{color:#15130f;text-align:center;max-width:280px;margin:auto;padding:0 24px;font:800 32px/1 system-ui,sans-serif;display:none}#boot p{margin:16px 0 0;font:400 16px/1.4 system-ui,sans-serif}#boot[data-unsupported]>.boot-picture{display:none}#boot[data-unsupported]>.boot-old{display:block}</style>
    <script type="module" crossorigin src="./assets/index-mwztrhtq.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-DclECHGd.js">
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown at once; the loading screen takes this element over when the bundle starts. -->
    <div id="boot">
      <img class="boot-picture" src="./assets/loading-Bn2v9oht.webp" alt="" />
      <!-- Shown by src/app/boot.ts when the browser is too old to draw the app. -->
      <div class="boot-old">
        Lucky Cat
        <p>Please update your phone software and Telegram to open Lucky Cat.</p>
      </div>
    </div>
  </body>
</html>
